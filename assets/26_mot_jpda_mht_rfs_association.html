</style><script>function sendPrompt(t){console.log('sendPrompt:',t)}function openLink(u){window.open(u,'_blank')}</script></head><body><main class='widget'><svg width="100%" viewBox="0 0 680 345" role="img"><title>JPDA vs MHT vs RFS on one scan</title><desc>One scan with two predicted tracks and their gates. Detection z1 is inside only T1's gate, z2 lies inside both gates, and z3 lies outside every gate. JPDA spreads z2 softly across tracks and merges into one Gaussian per track. MHT keeps the top-K global association hypotheses and prunes over an N-scan window. RFS methods such as PMBM carry an explicit existence probability per Bernoulli track and can spawn z3 as a new low-existence track.</desc>
